[package]
name = "migo-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The realtime transport core: WebSocket-shaped sessions, the connection lifecycle state machine, the subscription hub with encode-once fanout, and the three-class backpressure queue with resume and cumulative ACK."

[dependencies]
migo-core.workspace = true
migo-wire.workspace = true
migo-protocol.workspace = true
migo-auth.workspace = true
migo-ratelimit.workspace = true

tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
bytes.workspace = true
async-trait.workspace = true
tracing.workspace = true
parking_lot.workspace = true
dashmap.workspace = true

[dev-dependencies]
migo-cache.workspace = true
migo-store.workspace = true
migo-captcha.workspace = true
# Dev-only, for the instrumented replay of inflate_raw's driving loop in the
# gateway suite: when the real decoder refuses a compressed frame, the replay
# prints the exact call sequence (flush, status, consumed, produced) that led
# to the refusal, so CI names the failing call and not just the variant.
flate2 = { workspace = true }
tokio = { workspace = true, features = [
    "rt",
    "macros",
    "rt-multi-thread",
    "time",
    "sync",
    # `test-util` pauses the clock, so the liveness and drain tests resolve their timers
    # instantly instead of waiting out a production tick.
    "test-util",
] }
