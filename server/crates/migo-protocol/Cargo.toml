[package]
name = "migo-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MWP/1 message types, opcodes, and error codes, generated from the protocol schema."

[dependencies]
migo-core.workspace = true
migo-wire.workspace = true

[dev-dependencies]
# The budget gate (tests/budgets.rs) seals its sample envelopes with the real
# AEAD rather than padding with placeholder bytes, so a budget that only passes
# because the sample ciphertext shrank is not a budget that was ever met.
migo-crypto.workspace = true
