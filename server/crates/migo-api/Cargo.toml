[package]
name = "migo-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The REST/JSON surface: auth bootstrap, health, readiness, metrics, and the runtime config document — everything deliberately not realtime, exposed as an axum Router that migod mounts."

[dependencies]
migo-core.workspace = true
migo-protocol.workspace = true
migo-auth.workspace = true
migo-ratelimit.workspace = true

async-trait.workspace = true
tracing.workspace = true
axum.workspace = true
tower-http.workspace = true
serde.workspace = true
hex = "0.4"
base64.workspace = true
migo-captcha.workspace = true
migo-media.workspace = true
# The operator surface states the store's own audit and report vocabulary, and the
# moderation service's own cases: a trait whose methods return those types cannot be
# consumed without naming them.
migo-moderation.workspace = true
migo-store.workspace = true

[dev-dependencies]
# The auth-flow suite completes challenges it issues itself, which needs the test-only
# answer door in migo-captcha; no production path enables it.
migo-captcha = { workspace = true, features = ["test-internal"] }
bytes.workspace = true
parking_lot.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread"] }
migo-cache.workspace = true
tower.workspace = true
serde_json.workspace = true
async-trait.workspace = true
