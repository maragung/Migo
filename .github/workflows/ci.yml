# Migo — the gate every pull request has to get through.
#
# The rule this file exists to enforce is in docs/10-testing-strategy.md section 9:
# nothing merges red. So the jobs are ordered by how fast they can say no. A brief that
# contradicts the schema is caught in under a minute and never waits for a Rust build.
#
# Every step below is a Makefile target, and that is the point: `make ci` is the single
# source of truth for what "green" means, so a gate cannot exist in CI without existing on
# a developer's laptop too. The jobs run the targets in pieces only so that the Rust half
# lands in the job with a warm `target/` and the JavaScript half in the job with pnpm —
# `make ci` runs the same set in one go, and a target added to one and not the other is
# the bug this arrangement is meant to prevent.
#
# What this file adds on top is the *services* that turn a laptop run into a real one:
# with the variables set, the contract suites exercise PostgreSQL and Redis, and with
# MIGO_TEST_REQUIRE_BACKENDS set they fail rather than skip if a service ever goes missing
# from this file.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request that gets three pushes in five minutes should burn one runner, not
# three. `main` is excluded from cancellation: a cancelled push build leaves no record
# of whether the merged commit was ever green.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A CI runner is thrown away after the build, so there is nobody left to read an
  # incremental cache — and building without it is both faster and smaller.
  CARGO_INCREMENTAL: 0
  # Debug info is the largest thing in `target/`, it is never opened here, and dropping
  # it roughly halves what the cache has to carry between runs.
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  # ------------------------------------------------------------------ fast gates
  # Node only. No Rust toolchain, no database, no cache to warm: this job's whole
  # purpose is to fail in a minute when it is going to fail at all.
  gates:
    name: Brief and protocol gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pinning an interpreter is what lets the gates install what they import: the
      # distribution Python on the runner image is an externally-managed environment
      # (PEP 668) and refuses `pip install`, while a tool-cache interpreter accepts it.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Every third-party module any gate imports, installed in one place. This step is
      # not optional bookkeeping: pinning the interpreter above also *hides* whatever the
      # runner image happened to pre-install, and the crypto vector generator imports
      # `cryptography`, which the image ships and the tool cache does not. Installing it
      # here is what keeps the gate reading its own generators rather than the image's
      # package list. infra-check imports `yaml`; nothing else under tools/ imports
      # anything outside the standard library.
      - name: Python modules the gates import
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml cryptography

      - name: Generated protocol code is not stale
        run: make protocol-check

      - name: Generated entities match the migrations
        run: make entity-check

      - name: The brief does not contradict the schema or the docs
        run: make brief-check

      - name: Conformance vectors are not stale
        # Python only, two seconds, no Rust. If a generator's output moved, that is
        # the failure worth reading — the runner assertions downstream of it would
        # all report the same thing at ten minutes' notice instead of one.
        run: make vector-check

      - name: Android Kotlin passes the static checks
        # Here rather than in android.yml on purpose. That workflow only triggers on
        # clients/android and shared/protocol, so a change anywhere else could leave the
        # Kotlin tree broken with nothing to say so until someone next touches it. This
        # step is Python and costs a second, and the failure it exists for — a nesting
        # block comment that hides the rest of a file — otherwise arrives as several
        # hundred unresolved references in a six-minute Gradle run.
        run: make kotlin-check

      - name: Infra files pass the static hygiene checks
        # Deployment mistakes are the ones nobody sees until they are already running:
        # an image tag that quietly moved, a secret typed into a compose file, a
        # container that asked for the host's PID namespace. This reads the files, so
        # it needs no Docker and no cluster and belongs in the one-minute job.
        run: make infra-check

      - name: The gate installs exactly the Python modules it imports
        # The guard for the step three above this one. Pinning an interpreter is what
        # makes the install line necessary, and an install line that nothing checks
        # drifts from the imports it is meant to cover -- which is exactly how the
        # crypto vector gate broke once already. This compares the two directly.
        run: make pydeps-check

      - name: No secret-shaped string is committed
        # Brief section 183's committed half. A leaked credential is the one class of
        # failure that gets worse with every minute it sits unnoticed, so it belongs
        # in the one-minute job, before any build spends a runner on a commit that
        # will be reverted anyway. The scanner self-tests its own rules on synthetic
        # samples, so a regex that rotted into uselessness fails here too.
        run: make secret-check

  # ------------------------------------------------------------------ rust
  # One job for formatting, lints and the whole test suite, because all three want the
  # same warm `target/` directory and splitting them means building the workspace three
  # times to save nothing.
  server:
    name: Rust — fmt, clippy, tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: gates

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: migo
          POSTGRES_PASSWORD: migo
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        # Without a health check the first test connects before the server is listening
        # and the whole suite fails on a race that reproduces one run in ten.
        options: >-
          --health-cmd "pg_isready -U migo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The contract suites read these. Set here rather than per-step so that every
      # `cargo test` in this job sees them — a suite that runs in one step and skips in
      # the next is worse than one that never runs.
      MIGO_TEST_DATABASE_URL: postgres://migo:migo@127.0.0.1:5432/postgres
      MIGO_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      # Turns "the backend was not configured" from a silent skip into a failure. This
      # is the line that makes the two variables above load-bearing.
      MIGO_TEST_REQUIRE_BACKENDS: '1'

    steps:
      - uses: actions/checkout@v4

      # Stable, because that is what server/rust-toolchain.toml declares and therefore
      # what every developer's `make ci` uses. The `rust-version = 1.94` promise is
      # verified by the `msrv` job below instead of by pinning this one, so a lint that
      # only stable knows about is still caught here.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          # Lints and tests build different artefacts; sharing one cache key between
          # jobs that build different things means neither of them ever hits.
          key: server-tests

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The lockfile matches the manifests
        run: cargo metadata --locked --manifest-path server/Cargo.toml --format-version 1 >/dev/null
        # `--locked` makes cargo refuse rather than rewrite, so a manifest whose
        # dependency set has moved ahead of server/Cargo.lock fails here instead of
        # passing every other gate. That hole is not hypothetical: when migo-sfu
        # joined the workspace its manifest landed without the lock entry, and
        # nothing on a pull request could see it — the only job that notices is
        # `vectors-regen`, which is main-only because it pushes. The cost of
        # missing it there is a red main after the merge, which is exactly the
        # failure this step moves onto the PR that caused it. Resolution only:
        # no compilation, so it is seconds, not minutes.

      # The -rust half only. This job has a Rust toolchain and no pnpm, so the Prettier
      # half of the same gate runs in `web` — see the note above `fmt-check-rust`.
      - name: Formatting
        run: make fmt-check-rust

      - name: Clippy, warnings denied
        run: make lint-rust

      - name: Documentation has no broken intra-doc links
        run: make doc-check

      - name: Tests, with PostgreSQL and Redis behind the contract suites
        run: make test-server

      - name: Cross-language conformance vectors, Rust side
        # Redundant with test-server today, because the runners are ordinary test
        # binaries in the workspace. Named separately anyway: a reviewer looking for
        # "do the bindings still agree" should find a step called that rather than
        # have to know it hides inside another. The TypeScript side of the same files
        # is the last step of the `web` job; both must pass for the claim to hold.
        run: make test-vectors-rust

      - name: Protocol budgets, brief sections 56 and 171
        # The bandwidth targets are budgets, and this is what makes that sentence
        # true: typical frames measured with the real encoder against the numbers
        # the brief promises. Runs in this job because it needs the warm target/
        # the tests above already built — on its own it would pay a full workspace
        # build to measure seven frames.
        run: make budget-check

  # ------------------------------------------------------------------ msrv
  # `rust-version = "1.94"` in server/Cargo.toml is a promise to anyone who depends on
  # these crates, and a promise nothing verifies is a comment. It gates, because breaking
  # it is a breaking change; it only runs `cargo check`, because compiling is what the
  # promise is about — the behaviour is already covered by the job above.
  #
  # 1.94 is not a number this project chose: it is what sea-orm 2.0 declares, so the floor
  # is set by a dependency and can move without anyone here editing a file. That is the
  # concrete thing this job catches — a `cargo update` that pulls a sea-orm patch with a
  # higher `rust-version` compiles fine on stable and fails only here, which is where a
  # floor moving under us should be discovered rather than in a downstream build.
  msrv:
    name: Compiles on Rust 1.94, as declared
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: gates
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: msrv

      # --all-targets so tests and examples are held to the same version as the library.
      # A test that only builds on stable is a test nobody can run on the declared
      # minimum, which makes the minimum untestable.
      - name: cargo check on the declared minimum
        run: |
          cargo check --manifest-path server/Cargo.toml \
            --workspace --all-targets --all-features

  # ------------------------------------------------------------------ desktop
  # The desktop client is its own Cargo workspace, so it gets its own job rather than a
  # step inside `server`. Two reasons, both about the cache. Swatinem/rust-cache keys on a
  # workspace path, so a second workspace in the same job either shares a key and thrashes
  # it or needs a second entry that the job then restores on every run whether it touched
  # that code or not. And the two dependency graphs have almost nothing in common: this one
  # is winit, glutin and a windowing stack, the other is sea-orm and a database driver.
  # Keeping them apart means a change to one does not invalidate the other's cache.
  #
  # fmt and clippy only. This job never links, which is what lets it skip the graphics
  # development headers that `release.yml` installs for the real build: `cargo clippy`
  # compiles to metadata, and winit and glutin open libGL, libX11 and libwayland at run
  # time rather than at link time. The release build is where a linker error would show up,
  # and that is the right place for it -- there is no point paying an apt install on every
  # pull request to catch a class of error that only a release can produce.
  desktop:
    name: Desktop client — fmt, clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gates
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop
          key: desktop-lints

      - name: Formatting
        run: make fmt-check-desktop

      - name: Clippy, warnings denied
        run: make lint-desktop

  # --------------------------------------------------------------- desktop (windows)
  # The release workflow ships a Windows x86_64 build of the desktop client, so Windows has
  # to stay green between releases too, not just discover breakage at tag time. `cargo check`
  # only (no link): on Windows the GUI stack needs no system packages at all — eframe's glow
  # backend links the OpenGL that ships with the OS — so a check job is enough to catch any
  # `#[cfg(unix)]`-only API or unix-gated dependency that slips into the client or the five
  # server crates it depends on by path, at a fraction of a full build's minutes.
  desktop-windows:
    name: Desktop client — Windows check
    runs-on: windows-latest
    timeout-minutes: 30
    needs: gates
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/desktop
          key: desktop-check-windows

      - name: Check
        working-directory: clients/desktop
        shell: bash
        # A plain check, not clippy: clippy already runs on Linux, and this job exists to
        # answer one question -- does the client still compile for the Windows host? A
        # warning the Linux clippy gate lets through is the Linux gate's business.
        run: cargo check --locked --workspace

  # ------------------------------------------------------------------ typescript
  # The mirror of `server`: this job has pnpm and no Rust toolchain, so it runs the -js
  # halves of the shared gates. It used to probe for a root package.json and skip itself
  # with a notice; the workspace exists now, and a job that can skip itself is a job that
  # can go quiet the day someone moves that file.
  web:
    name: TypeScript — build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: gates
    steps:
      - uses: actions/checkout@v4

      # No version pinned here on purpose. pnpm/action-setup@v4 reads the version from
      # the "packageManager" field in package.json (pnpm@9.15.9); passing it in both
      # places is a hard error ("Multiple versions of pnpm specified"). package.json is
      # the single source of truth, and setup-node's `cache: pnpm` below keys off it too.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile so a lockfile that disagrees with the manifests fails here
      # rather than resolving to something nobody has ever run.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Before the lints, and before the tests, for two different reasons: the typed
      # ESLint rules need type information from the referenced projects, and every
      # package's `test` script runs `node --test` over dist/, where an absent build is
      # not an error but an empty glob — a suite that passes by not existing.
      - name: Build
        run: make build-ts

      - name: Formatting
        run: make fmt-check-js

      - name: Lint
        run: make lint-js

      - name: Test
        run: pnpm -r --if-present test

      - name: Cross-language conformance vectors, TypeScript side
        run: make test-vectors-ts

      # The full static-export build runs in CI — where every heavy build belongs — so a
      # Next.js regression (a bad route, a client-only API on the server path) fails the
      # pipeline before it can reach a release, without costing the dev machine anything.
      # The store is a Vite build into the web export's /store; building it here too, so
      # a store regression fails the pipeline the same way.
      - name: Web and store production build
        run: |
          make build-web
          make build-store

  # ------------------------------------------------------------------ hardening
  # Fuzz, stress and security — the bounded suites of brief section 172, as named
  # gates. Redundant with the server job's `make test-server`, which runs every one
  # of these test binaries too; the same trade test-vectors-rust makes, for the same
  # reason — a reviewer asking "is the security surface still refused" should find a
  # step called that rather than have to know it hides inside the workspace suite.
  # The separate job also buys parallelism, and it needs no service containers: the
  # fuzz and stress suites are in-process, and the security suite binds its own
  # loopback listener against in-memory backends.
  hardening:
    name: Fuzz, stress and security (bounded, brief section 172)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gates
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          # A different artefact subset than the server job builds, so a key of
          # its own means this job hits a cache it fills instead of fighting
          # over one neither can share.
          key: server-hardening

      - name: Bounded fuzz suites — wire codec and generated decoders
        run: make test-fuzz

      - name: Gateway stress suite — throttle and session-slot contracts
        run: make test-stress

      - name: Security — negative wire tests against the real TCP listener
        run: make test-security

  # ------------------------------------------------------------------ load
  # The load half of section 172: tools/loadgen's connect scenario against one
  # real migod. Release, not debug, because a load tool pointed at a debug build
  # reports the debug build's stalls as the server's errors. The budget is fixed
  # and bounded (50 concurrent sessions held for 30 seconds), and the gate is
  # loadgen's own exit code — 0 ok, 1 nothing connected, 3 over the error
  # budget — plus a /health check after the run, because the one thing the tool
  # cannot observe from inside is whether the node it hammered is still alive.
  # Throughput and percentiles are printed for humans to read and never
  # asserted: a slow runner is not a broken server.
  load:
    name: Load — concurrent sessions against one node
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: gates
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: server-load

      # loadgen is a workspace package depending on @migo/sdk, so the run needs
      # the frozen install plus the composite TypeScript build — the same chain
      # the web job pays, minus everything that only the web client needs.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        run: make build-ts

      - name: Load run — migod (release) under tools/load/run.sh
        run: make test-load

  # ------------------------------------------------------------------- e2e
  # The end-to-end gate (brief section 177): one real migod — real process, real
  # PostgreSQL database, real Redis, real filesystem media — driven by MigoClient
  # from @migo/sdk, the same code the browser runs. Not a second load run and not
  # a second hardening run: what it asserts is the observable truth after the
  # traffic, not the traffic — the message arrived with the sequence the send ack
  # promised, the media bytes round-trip byte-for-byte, the history survives a
  # node restart and replays without loss or duplication, /metrics saw the
  # session. The unit and contract suites mock nothing smaller than a storage
  # backend; this one mocks nothing at all, which is why it is its own job and
  # not another step in `server`.
  e2e:
    name: End-to-end — the real client through the real node
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: gates

    # Real storage, so the real services, same as the server job. The suite creates
    # its own per-run database inside this cluster through psql (the runner image
    # ships the client) and drops it on the way out, so concurrent runs cannot
    # share rows even if two ever land on the same runner.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: migo
          POSTGRES_PASSWORD: migo
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U migo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Same contract as the server job: the suite reads these, and the require
      # flag turns "not configured" from a skip into a failure. The suite is a
      # gate; a gate that can skip itself is a gate that can go quiet.
      MIGO_TEST_DATABASE_URL: postgres://migo:migo@127.0.0.1:5432/postgres
      MIGO_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      MIGO_TEST_REQUIRE_BACKENDS: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          # Only migod is built here, not the test binaries the server job
          # compiles, so this key fills a cache of its own shape.
          key: server-e2e

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The whole product in one step: the target builds migod, the suite's own
      # target then starts it against fresh backends and drives it with the SDK.
      - name: End-to-end suite
        run: make test-e2e

  # ------------------------------------------------------------------ audit
  # Advisories are news, not a reason to block an unrelated change: a CVE published
  # this morning against a transitive dependency would otherwise stop every pull
  # request in the repository until somebody upgrades. So this job reports and does not
  # gate — nothing `needs:` it — which is the same call the Makefile's `|| true` makes,
  # made once and in the open instead of buried in a recipe.
  audit:
    name: Dependency advisories (reports, does not gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: audit

      - name: cargo-audit
        # Run from `server/` rather than passing --file, because that is the directory
        # whose .cargo/audit.toml carries the one reasoned ignore this tree has. A job
        # that is red on every commit teaches everyone to scroll past it, which is the
        # opposite of what an advisory report is for, so the exception is written down
        # next to the lockfile it applies to instead of being tolerated as noise here.
        working-directory: server
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # ---------------------------------------------------------------- vectors-regen
  # The two rust-reference vector files (ML-DSA, the .migo container) are written
  # by the migo-account example binary, so regenerating them is a cargo build —
  # exactly the thing a laptop should not have to run to land a JSON. When a
  # change to migo-account moves those bytes, this job rewrites the files on a
  # runner and commits them: the byte-for-byte runners tolerate a missing case
  # for the one run that lands with stale JSON, and the commit pushed here is
  # what the next run pins against. It needs the server job green first, so a
  # broken example never gets to rewrite the vectors it is wrong about.
  #
  # The grep is the guard a "the case must exist" test cannot be: regeneration
  # is the only moment the case list can shrink unnoticed, so it is the moment
  # the list is checked. The dispatch at the end exists because a push made
  # with GITHUB_TOKEN triggers no workflows — without it the regenerated tree
  # would sit on main with no run to prove the ports agree on its bytes.
  vectors-regen:
    name: Regenerate rust-reference vectors when stale
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gates, server]
    # main only: on a pull request there is no branch this job may push to.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: vectors-regen

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The same modules the gates job installs, for the same reason: `make
      # vectors` runs the same generators, and pydeps-audit reads every install
      # line in this file against the imports under tools/.
      - name: Python modules the vector generators import
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml cryptography

      - name: Regenerate, and commit when the files moved
        id: regen
        run: |
          make vectors
          # The regenerated file must still name the rotated-identity case: a
          # generator change that quietly drops it is the one way the case
          # count can shrink with every other gate green.
          grep -q 'container_root_a_rotated' shared/protocol/vectors/crypto/account-container.json
          # The pathspec has to match what the commit below stages, and it is not
          # decoration: `make vectors` runs the generators through cargo, and a
          # cargo run rewrites server/Cargo.lock whenever the workspace manifests
          # have moved ahead of it. A bare `git diff --quiet` sees that unrelated
          # file, skips the "nothing to commit" exit, and lands on a `git commit`
          # with an empty index — which fails, and reports a stale-vectors-looking
          # error for a run whose vectors were in fact current. Naming the pathspec
          # keeps the guard about the vectors, which is the only thing this job owns.
          if git diff --quiet -- shared/protocol/vectors; then
            echo 'vectors are current — nothing to commit'
            echo 'committed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'migo-vectors-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add shared/protocol/vectors
          git commit -m 'chore: regenerate the rust-reference conformance vectors'
          git push
          echo 'committed=true' >> "$GITHUB_OUTPUT"

      - name: Run CI once on the regenerated tree
        if: steps.regen.outputs.committed == 'true'
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}'
