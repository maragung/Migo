# Migo — cut a release from a version tag.
#
# ci.yml and android.yml prove that main is green on every push and pull request. This
# workflow is what turns a green commit into artifacts people can run, and it fires only
# when a version tag is pushed (v1.2.3). The tag is the trigger and the single source of
# the version number: nothing here reads a version out of a file, so the tag and the
# artifacts can never disagree.
#
# Why the binaries are built here and not committed: the development sandbox has no
# Android or JVM toolchain and does not build release artifacts, so "the release binary"
# is, by construction, whatever a clean runner produces from the tagged source. That is
# the honest provenance — every asset below is compiled in this workflow from the commit
# the tag points at, not uploaded from a laptop.
#
# What a release produces:
#   * server_migod, a stripped Linux x86_64 binary, as a .tar.gz with a SHA-256 sidecar
#     (attached to the GitHub Release).
#   * client_web, the statically exported web bundle from clients/web/out, as a .tar.gz.
#   * client_desktop, a stripped Linux x86_64 binary of the native egui client, as a .tar.gz.
#   * client_desktop, the same client for Windows x86_64 (MSVC), as a .zip — a Windows user
#     unpacks a .tar.gz only reluctantly, so the Windows asset follows the platform's own
#     convention.
#   * client_android, the Android app APK (debug variant — the repository holds no
#     release-signing key, so a signed release build is not something CI can honestly
#     produce yet).
#   * Two container images pushed to GHCR: migo-migod and migo-web.
#
# Release-asset names carry an origin prefix: server_ for the server, client_ for anything
# that runs on a user's device (client_web, client_desktop, client_android). The prefix is
# on the uploaded file name only — the executable inside the server tarball stays `migod`,
# because the systemd unit, the Dockerfiles and docker-compose all invoke it by that name, so
# renaming the binary would break every one of them while renaming the asset breaks nothing.
# What the prefix buys is a release page that says at a glance what each file is and where it
# belongs.

name: Release

on:
  push:
    tags:
      - 'v*'
  # Lets a maintainer re-run the release for an existing tag from the Actions tab if a
  # single asset job failed — the create step is idempotent and every upload clobbers.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build the release for, e.g. v0.1.0'
        required: true

# A release must never be cancelled halfway, which would leave a release with some assets
# and not others. Group by the tag so two pushes of the same tag serialise, and never
# cancel an in-flight run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; the jobs that need to write a release or push a package widen
# it for themselves and nothing else.
permissions:
  contents: read

env:
  # The tag name drives everything. On a tag push GITHUB_REF_NAME is the tag; on a manual
  # dispatch it comes from the input. Both land in this one variable so every job below
  # reads the same thing.
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # ---------------------------------------------------------------- release shell
  # Creates the (empty) GitHub Release first, so the asset jobs have somewhere to upload
  # to and can run in parallel. Idempotent: re-running for a tag that already has a
  # release reuses it rather than failing, which is what makes workflow_dispatch re-runs
  # safe.
  create-release:
    name: Create the GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # gh resolves the target repository from the origin remote this checkout sets.
          fetch-depth: 0

      - name: Create or reuse the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
            # If a previous run left the release in draft, the assets uploaded below
            # would not be visible. Force it back to published so the page is consistent
            # with what a fresh run would produce.
            if gh release view "$TAG" --json isDraft --jq .isDraft | grep -q true; then
              echo "Release was a draft; publishing."
              gh release edit "$TAG" --draft=false
            fi
            exit 0
          fi
          # A tag with a pre-release suffix (v1.2.3-rc1) is marked pre-release so it does
          # not show up as the latest stable release. `--draft=false` makes the release
          # visible immediately; without it gh leaves the release in draft and the
          # assets uploaded below would land on a page nobody can see.
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" $prerelease \
            --title "Migo $TAG" \
            --generate-notes \
            --draft=false \
            --verify-tag

  # ---------------------------------------------------------------- migod binary
  migod-binary:
    name: migod — Linux x86_64 binary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Stable, matching ci.yml — the MSRV promise is verified there, so the release build
      # uses the same toolchain developers do.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: release-migod

      - name: Build the release binary
        run: cargo build --release --manifest-path server/Cargo.toml --bin migod

      - name: Package the tarball and checksum
        run: |
          version="${TAG#v}"
          triple="x86_64-unknown-linux-gnu"
          # server_ marks this as the server asset on the release page. Only the file name is
          # prefixed; the executable copied in below stays `migod`, the name the systemd unit,
          # the Dockerfiles and docker-compose all invoke.
          name="server_migod-${version}-${triple}"
          bin="server/target/release/migod"
          # strip mirrors the Docker image build, so the tarball and the container carry
          # the same size binary rather than one with debug symbols and one without.
          strip "$bin"
          mkdir -p "dist/${name}"
          cp "$bin" "dist/${name}/migod"
          # LICENSE if the repository carries one at the root; harmless if it does not.
          cp LICENSE "dist/${name}/" 2>/dev/null || true
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          ls -l dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber

  # ---------------------------------------------------------------- container images
  images:
    name: Container images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Independent of the release: the images live in the container registry, not as
    # release assets, so they do not need the release to exist first.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The built-in token has packages:write from the job permissions above — no personal
      # access token is used or needed to publish to this repository's GHCR namespace.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive version and owner
        id: meta
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # GHCR namespaces must be lowercase; the owner login may not be.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Both images build from the repository root as their context (see the header of
      # each Dockerfile), pushed twice: the exact version and a moving :latest.
      - name: Build and push migo-migod
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.migod
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/migo-migod:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/migo-migod:latest
          # The GitHub Actions cache backend keeps the cargo-chef dependency layer warm
          # between releases, so only changed crates recompile.
          cache-from: type=gha,scope=migod
          cache-to: type=gha,scope=migod,mode=max

      - name: Build and push migo-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/migo-web:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/migo-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  # ---------------------------------------------------------------- android apk
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install the SDK packages the build needs
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Wrapped in a retry loop for the same reason android.yml is: dependency resolution
      # reaches Maven Central and the Gradle Plugin Portal, both of which hand out HTTP 429
      # (rate limit) often enough on shared CI egress to redden an otherwise-green build.
      # Three attempts with growing backoff turn a transient 429 into a slower green; a
      # genuine compile error still fails all three and reports as it would without the loop.
      - name: Assemble the APK
        working-directory: clients/android
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "::group::Gradle attempt ${attempt}/3"
            if gradle --no-daemon --stacktrace :app:assembleDebug; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            if [ "${attempt}" -lt 3 ]; then
              echo "Attempt ${attempt} failed; backing off $((attempt * 20))s before retry."
              sleep $((attempt * 20))
            fi
          done
          echo "All 3 Gradle attempts failed." >&2
          exit 1

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          apk="clients/android/app/build/outputs/apk/debug/app-debug.apk"
          # client_ marks this as a client asset, matching client_web and client_desktop; the
          # APK gains a SHA-256 sidecar too, so every release asset is verifiable the same way.
          out="client_android-${version}-debug.apk"
          test -f "$apk" || { echo "APK not found at $apk" >&2; exit 1; }
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          gh release upload "$TAG" "$out" "$out.sha256" --clobber

  # ---------------------------------------------------------------- web bundle
  # The web client is a static export (see clients/web/next.config.mjs): `next build` with
  # output: 'export' writes plain HTML, CSS and JS into clients/web/out, and that directory is
  # the whole artifact. The tarball carries the contents of out/ with no leading out/ path
  # component, so it unpacks straight into any static host's document root.
  client-web:
    name: client_web — static bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # pnpm and Node exactly as ci.yml sets them up: pnpm/action-setup reads the version from
      # the packageManager field in package.json, and setup-node's `cache: pnpm` keys off the
      # same field — passing a version here would be the "Multiple versions of pnpm" error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile so a lockfile that disagrees with the manifests fails here rather
      # than resolving to something no developer has ever built.
      - name: Install
        run: pnpm install --frozen-lockfile

      # build-ts before build-web: the web app imports @migo/sdk and its siblings by their
      # compiled dist/ entry points, so those packages have to be built before `next build`
      # can resolve them — the same order the web image's Dockerfile builds in.
      - name: Build the SDK packages and the web client
        run: |
          make build-ts
          make build-web

      - name: Package the tarball and checksum
        run: |
          version="${TAG#v}"
          name="client_web-${version}"
          out="clients/web/out"
          # Fail loudly if the export produced nothing: an empty out/ would otherwise tar into
          # a valid-looking but useless asset that only reveals itself when someone deploys it.
          test -f "${out}/index.html" || { echo "web export produced no ${out}/index.html" >&2; exit 1; }
          mkdir -p dist
          # -C out . archives the contents of the directory rather than the directory itself,
          # so there is no leading out/ component to strip on unpack.
          tar -czf "dist/${name}.tar.gz" -C "$out" .
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          ls -l dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber

  # ---------------------------------------------------------------- desktop binary
  # clients/desktop is a separate cargo workspace with its own Cargo.lock, deliberately not a
  # member of the server workspace so eframe/winit/glutin stay out of the server's lockfile and
  # CI cache (see the note atop clients/desktop/Cargo.toml). That separation is honoured here: a
  # cache key distinct from the server's keeps the two workspaces from ever sharing a target/.
  client-desktop:
    name: client_desktop — Linux x86_64 binary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # eframe with the glow (OpenGL) backend and both the x11 and wayland features links
      # against the platform's window-system and GL libraries, and ubuntu-latest ships none of
      # the -dev packages. Install them: the X11 client libs winit uses (Xlib plus the Xcursor,
      # XInput2 and XRandR extensions), the Wayland client library the wayland feature links,
      # xkbcommon for the keymap handling shared by both display paths, and the mesa GL/EGL
      # development headers the glow backend builds against.
      - name: Install the GUI development libraries the build needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      # Stable, matching ci.yml and the migod job — clients/desktop/Cargo.toml declares the
      # same rust-version as the server, so the release build uses the toolchain developers do.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # The desktop workspace, not the server one, and a key of its own: the two lockfiles
          # and target/ dirs must never be shared, or one workspace would poison the other's
          # cache. release-migod above uses `workspaces: server` with a different key.
          workspaces: clients/desktop
          key: release-desktop

      - name: Build the release binary
        working-directory: clients/desktop
        # --locked so the build uses the committed Cargo.lock exactly; a release must not
        # silently resolve a dependency graph other than the one that was reviewed.
        run: cargo build --release --locked

      - name: Package the tarball and checksum
        run: |
          version="${TAG#v}"
          triple="x86_64-unknown-linux-gnu"
          name="client_desktop-${version}-${triple}"
          bin="clients/desktop/target/release/migo-desktop"
          test -x "$bin" || { echo "desktop binary not found at $bin" >&2; exit 1; }
          # The release profile already strips symbols; strip again anyway so the packaged asset
          # is symbol-free regardless of a future change to that profile, matching the migod job.
          strip "$bin"
          mkdir -p "dist/${name}"
          cp "$bin" "dist/${name}/migo-desktop"
          # LICENSE if the repository carries one at the root; harmless if it does not.
          cp LICENSE "dist/${name}/" 2>/dev/null || true
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          ( cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          ls -l dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.sha256 --clobber

  # ---------------------------------------------------------------- desktop binary (windows)
  # The same client, cross-built for nothing: this is a native build on a Windows runner, not a
  # cross-compile from Linux. The desktop client's platform-specific surface is small and already
  # gated (vault file permissions have a `#[cfg(not(unix))]` fallback; the `dirs` crate resolves
  # config and data directories to %APPDATA% on Windows), and eframe's glow backend links the
  # system OpenGL that ships with Windows — no equivalent of the Linux job's apt-get list exists
  # here, which is most of why this job is so much shorter.
  client-desktop-windows:
    name: client_desktop — Windows x86_64 binary
    runs-on: windows-latest
    timeout-minutes: 45
    needs: create-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Stable, matching the Linux desktop job and ci.yml. The MSVC toolchain the runner
      # preinstalls is what dtolnay/rust-toolchain's default host target resolves to.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Same workspace as the Linux desktop job but a key of its own: the two hosts must
          # never share cache entries, and the Linux job's key (release-desktop) already names
          # the other host's artifacts.
          workspaces: clients/desktop
          key: release-desktop-windows

      - name: Build the release binary
        working-directory: clients/desktop
        # --locked, exactly as the Linux job: a release builds the dependency graph that was
        # reviewed, not one cargo silently re-resolves.
        run: cargo build --release --locked

      # Bash on windows-latest is Git Bash: sha256sum and coreutils are present, and the
      # repository's packaging steps stay one language across both desktop jobs. bsdtar (the
      # tar.exe Windows ships) infers the archive format from the extension with -a, so the
      # same command line that would produce a .tar.gz produces the .zip a Windows user
      # expects. An explicit `shell: bash` on every step keeps the runner's default (pwsh)
      # from reinterpreting them.
      - name: Package the zip and checksum
        shell: bash
        run: |
          version="${TAG#v}"
          triple="x86_64-pc-windows-msvc"
          name="client_desktop-${version}-${triple}"
          bin="clients/desktop/target/release/migo-desktop.exe"
          test -f "$bin" || { echo "desktop binary not found at $bin" >&2; exit 1; }
          mkdir -p "dist/${name}"
          cp "$bin" "dist/${name}/migo-desktop.exe"
          # LICENSE if the repository carries one at the root; harmless if it does not.
          cp LICENSE "dist/${name}/" 2>/dev/null || true
          # -a makes the .zip extension (not .tar.gz) choose the archive format.
          tar -a -c -f "dist/${name}.zip" -C dist "${name}"
          ( cd dist && sha256sum "${name}.zip" > "${name}.zip.sha256" )
          ls -l dist

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber
