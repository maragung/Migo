# JVM heap for the Gradle daemon. Android builds with Compose want more than the 512m
# default or the configuration phase alone will thrash the collector.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Cache task outputs and run independent tasks (the two modules) in parallel. Safe here
# because :app depends on :core and Gradle orders them; nothing else races.
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX, not the retired com.android.support libraries.
android.useAndroidX=true

# Official Kotlin style, enforced by the IDE and by ktlint if it is added later.
kotlin.code.style=official

# R8/AAPT2 non-transitive R classes: each module gets only its own resources, which keeps
# the app module from accidentally referencing a core resource by an inherited R entry.
android.nonTransitiveRClass=true
